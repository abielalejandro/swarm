version: '3.8'

services:
  # ============================================
  # INFRAESTRUCTURA BASE
  # ============================================

  redis:
    image: redis:7.2-alpine
    container_name: swarm_redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swarm_network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.4   # Versión estable
    container_name: swarm_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=WARN
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    networks:
      - swarm_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: swarm_postgres
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swarm_secret}
      POSTGRES_DB: swarm_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm_audit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swarm_network
    restart: unless-stopped

  # ============================================
  # GUARDIAN - CONSTITUCIÓN
  # ============================================

  guardian:
    build:
      context: ./guardian
      dockerfile: Dockerfile
    container_name: swarm_guardian
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=swarm_audit
      - POSTGRES_USER=swarm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-swarm_secret}
      - HUMAN_OVERRIDE_SECRET=${HUMAN_OVERRIDE_SECRET:-change_me}
      - HUMAN_APPROVER_ID=${HUMAN_APPROVER_ID:-admin}
      - HUMAN_DEPLOYMENT_TOKEN=${HUMAN_DEPLOYMENT_TOKEN:-change_me}
      - LOG_LEVEL=INFO
      - IMMEDIATE_PENALTY_ENFORCEMENT=true
      # LLM Config (para el Guardian si usa LLM)
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    ports:
      - "8001:8001"
    volumes:
      - guardian_logs:/var/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

  # ============================================
  # PSYCHOLOGIST - DETECTOR DE ENGAÑOS
  # ============================================

  psychologist:
    build:
      context: ./psychologist
      dockerfile: Dockerfile
    container_name: swarm_psychologist
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GUARDIAN_URL=http://guardian:8001
      - LOG_LEVEL=INFO
      - TRUTH_SCORE_THRESHOLD=0.50
      - MAX_INTERROGATIONS_PER_AGENT_PER_DAY=3
      # LLM Config
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      guardian:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

  # ============================================
  # META-PSYCHOLOGIST - SUPERVISOR
  # ============================================

  meta_psychologist:
    build:
      context: ./meta_psychologist
      dockerfile: Dockerfile
    container_name: swarm_meta_psychologist
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PSYCHOLOGIST_URL=http://psychologist:8002
      - GUARDIAN_URL=http://guardian:8001
      - LOG_LEVEL=INFO
      - MAX_META_CALLS_PER_DAY=10
      # LLM Config
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_started
      psychologist:
        condition: service_started
      guardian:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

  # ============================================
  # AGENTS - NEGOCIACIÓN
  # ============================================

  agent_engineering:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: swarm_agent_engineering
    environment:
      - AGENT_ID=Engineering_001
      - AGENT_DOMAIN=Engineering
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GUARDIAN_URL=http://guardian:8001
      - PSYCHOLOGIST_URL=http://psychologist:8002
      - LOG_LEVEL=INFO
      # LLM Config
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4-turbo-preview}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      guardian:
        condition: service_started
      psychologist:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

  agent_finance:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: swarm_agent_finance
    environment:
      - AGENT_ID=Finance_001
      - AGENT_DOMAIN=Finance
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GUARDIAN_URL=http://guardian:8001
      - PSYCHOLOGIST_URL=http://psychologist:8002
      - LOG_LEVEL=INFO
      # LLM Config
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4-turbo-preview}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      guardian:
        condition: service_started
      psychologist:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

  agent_security:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: swarm_agent_security
    environment:
      - AGENT_ID=Security_001
      - AGENT_DOMAIN=Security
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GUARDIAN_URL=http://guardian:8001
      - PSYCHOLOGIST_URL=http://psychologist:8002
      - LOG_LEVEL=INFO
      # LLM Config
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4-turbo-preview}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      guardian:
        condition: service_started
      psychologist:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

  agent_devops:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: swarm_agent_devops
    environment:
      - AGENT_ID=DevOps_001
      - AGENT_DOMAIN=DevOps
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GUARDIAN_URL=http://guardian:8001
      - PSYCHOLOGIST_URL=http://psychologist:8002
      - LOG_LEVEL=INFO
      # LLM Config
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4-turbo-preview}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      guardian:
        condition: service_started
      psychologist:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

  agent_legal:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: swarm_agent_legal
    environment:
      - AGENT_ID=Legal_001
      - AGENT_DOMAIN=Legal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GUARDIAN_URL=http://guardian:8001
      - PSYCHOLOGIST_URL=http://psychologist:8002
      - LOG_LEVEL=INFO
      # LLM Config
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4-turbo-preview}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      guardian:
        condition: service_started
      psychologist:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

  # ============================================
  # EXECUTOR - EJECUCIÓN DE CONTRATOS
  # ============================================

  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    container_name: swarm_executor
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GUARDIAN_URL=http://guardian:8001
      - LOG_LEVEL=INFO
      # AWS (opcional)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # LLM Config
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    ports:
      - "8004:8004"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - executor_workspace:/workspace
    depends_on:
      redis:
        condition: service_started
      guardian:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

  # ============================================
  # DASHBOARD - UI DE MONITOREO
  # ============================================

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: swarm_dashboard
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=swarm_audit
      - POSTGRES_USER=swarm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-swarm_secret}
      - GUARDIAN_URL=http://guardian:8001
      - PSYCHOLOGIST_URL=http://psychologist:8002
      - META_PSYCHOLOGIST_URL=http://meta_psychologist:8003
      - EXECUTOR_URL=http://executor:8004
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - HUMAN_OVERRIDE_SECRET=${HUMAN_OVERRIDE_SECRET:-change_me}
      # LLM Config (para el Dashboard si usa LLM)
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    ports:
      - "8501:8501"
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_started
      guardian:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

  # ============================================
  # ORCHESTRATOR - COORDINADOR PRINCIPAL
  # ============================================

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: swarm_orchestrator
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GUARDIAN_URL=http://guardian:8001
      - PSYCHOLOGIST_URL=http://psychologist:8002
      - META_PSYCHOLOGIST_URL=http://meta_psychologist:8003
      - EXECUTOR_URL=http://executor:8004
      - MAX_ROUNDS_PER_NEGOTIATION=20
      - ROUND_TIMEOUT_SECONDS=60
      - LOG_LEVEL=INFO
      # Postgres (usuarios/auth)
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=swarm_audit
      - POSTGRES_USER=swarm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-swarm_secret}
      # Auth (PASETO v4.local en cookie segura)
      - PASETO_KEY=${PASETO_KEY:-change_me_paseto_32_bytes_minimum}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-28800}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # LLM Config
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4-turbo-preview}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_started
      guardian:
        condition: service_started
      psychologist:
        condition: service_started
      meta_psychologist:
        condition: service_started
      executor:
        condition: service_started
    networks:
      - swarm_network
    restart: unless-stopped

# ============================================
# REDES Y VOLÚMENES
# ============================================

networks:
  swarm_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24
          gateway: 172.16.0.1

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  postgres_data:
    driver: local
  guardian_logs:
    driver: local
  executor_workspace:
    driver: local